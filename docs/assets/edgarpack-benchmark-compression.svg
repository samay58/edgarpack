<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">EdgarPack 10-K token compression benchmark</title>
  <desc id="desc">A minimal benchmark chart showing raw 10-K HTML at a median of 595 thousand cl100k tokens and clean EdgarPack packs at a median of 102 thousand tokens. The chart marks the 128 thousand token context window and an 85.6 percent median reduction.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf6ec"/>
      <stop offset="0.58" stop-color="#f6eddf"/>
      <stop offset="1" stop-color="#efe2cf"/>
    </linearGradient>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M4 11 C12 8, 20 13, 29 10 S39 9, 41 16" fill="none" stroke="#09193b" stroke-opacity="0.035" stroke-width="0.8"/>
      <path d="M2 31 C12 28, 19 33, 30 29 S38 28, 41 33" fill="none" stroke="#9a5a38" stroke-opacity="0.032" stroke-width="0.8"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-8%" width="112%" height="122%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#061638" flood-opacity="0.10"/>
    </filter>
    <style>
      .serif { font-family: Georgia, serif; }
      .sans { font-family: Arial, sans-serif; }
      .mono { font-family: monospace; }
      .ink { fill: #071537; }
      .muted { fill: #627084; }
      .paper-line { stroke: #d7c5aa; }
      .navy-stroke { stroke: #071537; }
      .copper-stroke { stroke: #9b5a37; }
      .olive-stroke { stroke: #526a46; }
      .range { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="960" height="480" rx="24" fill="url(#paper)"/>
  <rect width="960" height="480" rx="24" fill="url(#grain)" opacity="0.8"/>
  <rect x="34" y="32" width="892" height="416" rx="22" fill="#fff9ee" fill-opacity="0.62" stroke="#d8c5aa" stroke-width="1.2" filter="url(#shadow)"/>

  <g transform="translate(78 70)">
    <text class="serif ink" x="0" y="0" font-size="32">10-K HTML, compressed into a cited pack</text>
    <text class="sans muted" x="2" y="29" font-size="14">Latest NVDA, AAPL, and TSLA 10-Ks. Measured 2026-04-20 with cl100k tokens.</text>
  </g>

  <g transform="translate(86 136)">
    <rect x="0" y="0" width="788" height="220" rx="16" fill="#fffdf7" fill-opacity="0.48" stroke="#e1d1ba" stroke-width="1"/>

    <g transform="translate(144 0)">
      <path d="M0 178 C132 176, 262 179, 402 177 S516 176, 600 178" fill="none" stroke="#071537" stroke-opacity="0.30" stroke-width="1.4" stroke-linecap="round"/>
      <g class="mono muted" font-size="11">
        <text x="-4" y="199">0</text>
        <text x="70" y="199">128k</text>
        <text x="388" y="199">600k</text>
        <text x="586" y="199">900k</text>
      </g>

      <rect x="0" y="42" width="85.3" height="102" rx="8" fill="#526a46" fill-opacity="0.08"/>
      <path d="M85.3 27 C83.8 69, 86.9 116, 85.1 160" fill="none" stroke="#9b5a37" stroke-width="1.8" stroke-linecap="round"/>
      <text class="serif" x="100" y="35" fill="#9b5a37" font-size="17" font-style="italic">128k context window</text>

      <g transform="translate(0 68)">
        <path class="range" d="M328 0 C368 -5, 420 4, 462 0 S520 -2, 542 0" stroke="#071537" stroke-opacity="0.18" stroke-width="15"/>
        <path class="range navy-stroke" d="M328 0 C375 3, 418 -4, 462 -1 S520 3, 542 0" stroke-width="3.2"/>
        <circle cx="328" cy="0" r="8" fill="#d8cab6" stroke="#071537" stroke-width="2"/>
        <circle cx="396.7" cy="0" r="9" fill="#071537"/>
        <circle cx="542" cy="0" r="8" fill="#d8cab6" stroke="#071537" stroke-width="2"/>
        <text class="serif ink" x="377" y="-36" font-size="34">595k</text>
        <text class="sans muted" x="459" y="-36" font-size="14">median</text>
        <text class="mono muted" x="315" y="34" font-size="12">492k-813k</text>
      </g>

      <g transform="translate(0 136)">
        <path class="range" d="M47 0 C53 -3, 61 3, 68 1 S74 -2, 75 0" stroke="#526a46" stroke-opacity="0.24" stroke-width="15"/>
        <path class="range olive-stroke" d="M47 0 C54 2, 61 -3, 68 1 S73 2, 75 0" stroke-width="3.2"/>
        <circle cx="47" cy="0" r="7" fill="#d8cab6" stroke="#526a46" stroke-width="2"/>
        <circle cx="68" cy="0" r="9" fill="#526a46"/>
        <circle cx="75" cy="0" r="7" fill="#d8cab6" stroke="#526a46" stroke-width="2"/>
        <text class="serif ink" x="95" y="10" font-size="34">102k</text>
        <text class="sans muted" x="184" y="8" font-size="14">median, inside the window</text>
        <text class="mono muted" x="37" y="34" font-size="12">71k-113k</text>
      </g>
    </g>

    <g transform="translate(28 59)">
      <text class="sans ink" x="0" y="0" font-size="15" font-weight="700">Raw 10-K HTML</text>
      <text class="sans muted" x="0" y="23" font-size="12">filing index HTML</text>
    </g>
    <g transform="translate(28 127)">
      <text class="sans ink" x="0" y="0" font-size="15" font-weight="700">EdgarPack</text>
      <text class="sans muted" x="0" y="23" font-size="12">clean filing.full.md</text>
    </g>
  </g>

  <g transform="translate(86 380)">
    <rect x="0" y="0" width="788" height="44" rx="12" fill="#071537"/>
    <g class="sans" font-size="13">
      <text x="24" y="28" fill="#f7ead7">Median reduction</text>
      <text x="160" y="28" fill="#ffffff" font-weight="700">85.6%</text>
      <path d="M258 10 L258 34" stroke="#f7ead7" stroke-opacity="0.22"/>
      <text x="286" y="28" fill="#f7ead7">Median payload</text>
      <text x="410" y="28" fill="#ffffff" font-weight="700">595k -> 102k tokens</text>
      <path d="M568 10 L568 34" stroke="#f7ead7" stroke-opacity="0.22"/>
      <text x="596" y="28" fill="#f7ead7">Input cost</text>
      <text x="680" y="28" fill="#ffffff" font-weight="700">$1.79 -> $0.31</text>
    </g>
  </g>

  <g transform="translate(86 437)">
    <text class="mono muted" x="0" y="0" font-size="11">Source: benchmarks/efficiency-2026-04-20.json and docs/BENCHMARKS.md. Raw is combined filing HTML; clean is filing.full.md.</text>
  </g>
</svg>
