# 8-12 line ascii diagram of the dominant lifecycle, plain English verbs.
# This goes into docs/learn/README.md as the napkin sketch.
napkin_sketch: |
  You run a CLI command (build, query, comps, compare, which, list).
    The CLI parses your args and dispatches to a subcommand.
      v
    Resolve identity: name/ticker/CIK -> ResolvedCompany (source = sec | hkex | private)
      v
    Route by source:
      sec   -> submissions / archives / companyfacts / filing HTML over SECClient
              (rate-limited token bucket, SHA256 disk cache, atomic writes)
      hkex  -> read prebuilt pack's facts.json (HKEX extractor ran at pack time)
      v
    Parse (build only):  strip iXBRL -> clean HTML -> semantic normalize -> render markdown -> sectionize
    Pack  (build only):  write full.md, sections/*.md, llms.txt, facts.json, manifest.json (hashes)
    Period (query):      alias -> metric (layer_zero, presets), pick ltm/lfy/lfy-N/mrq facts, run formulas
    Discover (which):    LLM-scan MD&A + cached catalog -> DiscoveredKpi rows across periods
    Compare:             fan out query(company, period) per input, USD-convert, mismatch-guard
      v
    Cite:                every value carries company, accession, filing date, anchor URL
      v
    Render:              table / json / markdown / pack directory on disk

# Trails: narrative walks through concrete actions.
# Order matters. trail-0 is the entry point a new reader hits first.
trails:
  - id: trail-0-full-loop
    title: "From `edgarpack query NVDA revenue` to a cited number"
    estimated_minutes: 18
    covers:
      - edgarpack/cli.py:_cmd_query
      - edgarpack/query/financials.py:financials
      - edgarpack/sec/tickers.py:resolve_ticker
      - edgarpack/sec/xbrl.py:fetch_company_facts
      - edgarpack/query/concepts.py:resolve_concept
      - edgarpack/query/periods.py:select_period
      - edgarpack/query/models.py:CitedValue
    why: "First contact. Walks the most common command from keypress to printed table. Touches every load-bearing module in the query path."

  - id: trail-1-build-a-pack
    title: "How `edgarpack build` turns a filing into deterministic markdown"
    estimated_minutes: 14
    covers:
      - edgarpack/cli.py:_cmd_build
      - edgarpack/pack/build.py:build_pack
      - edgarpack/sec/submissions.py:get_latest_filing
      - edgarpack/sec/archives.py:fetch_filing_html
      - edgarpack/parse/ixbrl_strip.py:strip_ixbrl
      - edgarpack/parse/html_clean.py:clean_html
      - edgarpack/parse/semantic_html.py:reduce_to_semantic
      - edgarpack/parse/md_render.py:render_markdown
      - edgarpack/parse/sectionize.py:sectionize
      - edgarpack/pack/manifest.py:create_manifest
    why: "The other half of the system. Shows the parse pipeline as a strict ordered chain and explains why it has to be ordered. Also shows what 'deterministic' actually means in practice (sorted artifacts, hash-addressed manifest)."

  - id: trail-2-rate-limited-fetch
    title: "What happens during a single SEC HTTP call"
    estimated_minutes: 8
    covers:
      - edgarpack/sec/client.py:SECClient.fetch
      - edgarpack/sec/client.py:RateLimiter.acquire
      - edgarpack/sec/cache.py:DiskCache
      - edgarpack/config.py
    why: "The seam everything else depends on. Rate limiting, retry-with-backoff, atomic disk caching, gzip handling. If you don't understand this, you'll write code that gets the SEC angry at you."

  - id: trail-3-period-selection
    title: "How `--period ltm` becomes three filings and one formula"
    estimated_minutes: 16
    covers:
      - edgarpack/query/periods.py:select_period
      - edgarpack/query/financials.py:_compute_derived
      - edgarpack/query/concepts.py:METRIC_MAP
      - edgarpack/query/concepts.py:resolve_concept
    why: "The single subtlest part of the system. LTM math, anchor selection, fiscal-year matching, staleness rejection, segment filtering, the consolidated-vs-segment preference. Most reasoning bugs in financial code live here."

  - id: trail-4-citation-anchors
    title: "How a number gets a deep-link URL back to the filing"
    estimated_minutes: 10
    covers:
      - edgarpack/query/financials.py:_fetch_fact_id_maps
      - edgarpack/query/financials.py:_enrich_fact_ids
      - edgarpack/query/periods.py:parse_fact_ids_from_html
      - edgarpack/query/models.py:CitedValue.anchor_url
    why: "The part the README says 'really matters'. Walks the (concept, value) compound key, the inline XBRL fact_id parse, the URL fallback chain. Explains why the anchor URL is the difference between citation and hand-waving."

  - id: trail-5-compare-companies
    title: "How `edgarpack compare AAPL MSFT GOOGL --period lfy` builds a side-by-side table"
    estimated_minutes: 12
    covers:
      - edgarpack/cli.py:p_compare
      - edgarpack/compare.py:cmd_compare
      - edgarpack/compare.py:_convert_to_usd
      - edgarpack/compare.py:_period_header
      - edgarpack/compare.py:_diagnostics_lines
      - edgarpack/identity.py:resolve
      - edgarpack/fx/
      - edgarpack/query/financials.py:financials
    why: "Shows fan-out: the same single-company query runs N times, then gets folded into one table. Introduces identity routing (sec vs hkex vs private), currency conversion with native/usd/both modes, the fiscal-year mismatch guard, and unit-sanity footers. Read this before assuming `financials()` is the whole query story."

  - id: trail-6-which-kpi-discovery
    title: "How `edgarpack which FIG` finds the KPIs a company actually discloses"
    estimated_minutes: 14
    covers:
      - edgarpack/cli.py:_cmd_which
      - edgarpack/query/kpi_discover.py:discover_kpis
      - edgarpack/query/kpi_discover.py:_discover_pack
      - edgarpack/query/kpi_discover.py:_catalog_points_for_cik
      - edgarpack/query/kpi_discover.py:CompanyKpiAggregate
      - edgarpack/query/kpi_extract.py
      - edgarpack/query/learned_registry.py
    why: "The qualitative/MD&A counterpart to `query`. Walks the per-pack LLM scan, the cached catalog fallback, the period-point aggregation, and how --no-cache / --only / --max-periods reshape what you see. Also covers the learned-registry side door that `query` uses to hit LLM-discovered metrics."

# Refs: function-level reference docs.
# A module gets a ref if other modules depend on it heavily, or if it has
# subtle invariants worth surfacing. Glue and thin wrappers don't need refs.
refs:
  - id: ref-sec-client
    module: edgarpack/sec/client.py
    why: "Network seam. Token bucket, retry-with-jittered-backoff, gzip handling, per-event-loop singleton. Every other module that touches the SEC depends on this."

  - id: ref-pack-build
    module: edgarpack/pack/build.py
    why: "13-step pack orchestrator. The order matters; this ref documents why each step exists, what it produces, and what would break if you reordered."

  - id: ref-sectionize
    module: edgarpack/parse/sectionize.py
    why: "Form-aware section detection. 824 lines of regex and form-specific rules. Slug stability, TOC stub filtering, the section_id contract that the manifest depends on."

  - id: ref-periods
    module: edgarpack/query/periods.py
    why: "The hairiest module in the codebase (1,338 lines as of 2026-04-20, up from 961). Period semantics, LTM math, anchor selection, segment filtering, ix:nonFraction parsing, the recent period-routing tightening + lfy-N DSL. Documents the invariants that aren't obvious from reading the code."

  - id: ref-financials
    module: edgarpack/query/financials.py
    why: "Top-level query orchestrator. Derived metric computation with cycle protection, staleness guards, the low-debt sanity check, fact_id enrichment pass."

  - id: ref-query-models
    module: edgarpack/query/models.py
    why: "The citation contract. CitedValue, DerivedValue, QueryResult. Every public number in the system flows through one of these. Documents the URL builders and the provenance fields."

  - id: ref-cache
    module: edgarpack/sec/cache.py
    why: "SHA256-keyed disk cache with atomic writes. Small file but encodes the determinism guarantee. Every fetch path goes through it."

  - id: ref-identity
    module: edgarpack/identity.py
    why: "The routing seam added in 2026-04. IdentityIndex, ResolvedCompany, Source enum. Determines whether a company's facts come from SEC HTTP calls, a prebuilt HKEX pack's facts.json, or a private-company exit. Every multi-company command (compare, comps, query) resolves through this first."

  - id: ref-query-layer-zero
    module: edgarpack/query/layer_zero.py
    why: "Metric name resolution + fuzzy suggestions. resolve_alias() is the first thing `query` runs on user input; suggest_metrics() produces the 'did you mean...' error. Paired with presets.py (expand_metrics) for --metrics and --preset expansion. Small, load-bearing, easy to break by reordering."

# Things you considered and deliberately skipped. Each gets one line of reason.
# Future runs will reconsider these. Silent omissions are bugs.
omitted:
  - target: edgarpack/harvest/
    reason: "Batch orchestrator on top of build_pack. Separate concern, deserves its own learn pack later if it grows."
  - target: edgarpack/diff/
    reason: "Section-diff and timeline analysis on top of built packs. Derived layer, not part of the core pipeline a new reader needs to understand first."
  - target: edgarpack/index/ and edgarpack/insights/
    reason: "Search and analytical layers on top of packs. Useful but not load-bearing for understanding the core lifecycle."
  - target: edgarpack/china/
    reason: "China Lens is a separate sub-product with its own pipeline (acquire/extract/translate/synthesize/qa). It deserves its own learn pack."
  - target: edgarpack/hk/
    reason: "HKEX extraction. Runs at pack time and writes into facts.json; identity routing reads that output. Linked from trail-5; doesn't need its own ref until the extractor gets more complex."
  - target: edgarpack/api/ and edgarpack/site/
    reason: "Rendering and serving layers. Once you understand the core CLI lifecycle these become straightforward wrappers."
  - target: edgarpack/parse/tokenize.py
    reason: "Thin wrapper around tiktoken with a stdlib fallback. Linked from trail-1 but doesn't need its own ref."
  - target: edgarpack/query/comps.py
    reason: "Multi-company orchestrator on top of financials(). Same patterns as financials() applied N times. Linked from trail-0; doesn't need its own ref."
  - target: edgarpack/query/self_heal.py
    reason: "Recovery pass when derived metrics (headcount, runway) need a text-scan fallback. Called from financials(); surfaces in trail-3/ref-financials as a note rather than its own trail."
  - target: edgarpack/query/metric_map.py and edgarpack/query/presets.py
    reason: "Static maps and CSV expansion. Covered by ref-query-layer-zero; don't need separate refs."
  - target: edgarpack/fx/
    reason: "FX rates for compare's USD conversion. Pure data lookup; linked from trail-5, doesn't warrant its own ref."
  - target: edgarpack/sse/
    reason: "Server-sent events for translation pipeline progress. Not in the core query/pack lifecycle."
