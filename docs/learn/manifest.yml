napkin_sketch: |
  CLI command
    query/comps/compare -> resolve identity -> load facts -> pick metric -> pick period -> cite -> render
    build               -> resolve filing -> fetch primary HTML -> clean -> markdown -> sections -> hashes
    which               -> read built packs -> extract disclosed KPIs -> cache rows -> query can reuse
    diff/timeline       -> compare packs -> anchor changed paragraphs -> static HTML
    distill             -> read one pack -> write cited rows + evidence + gaps -> validate

