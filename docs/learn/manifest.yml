# 8-12 line ascii diagram of the dominant lifecycle, plain English verbs.
# This goes into docs/learn/README.md as the napkin sketch.
napkin_sketch: |
  You run a CLI command (build, query, comps, list).
    The CLI parses your args and dispatches to a subcommand.
      v
    Resolve company:  ticker -> CIK
      v
    Fetch from SEC:   submissions / archives / companyfacts / filing HTML
      (rate-limited token bucket, cached on disk by SHA256, atomic writes)
      v
    Parse (build only): strip iXBRL -> clean HTML -> semantic normalize -> render markdown -> sectionize
      v
    Pack (build only):  write full.md, sections/*.md, llms.txt, manifest.json with hashes
    Period (query):     pick the right facts for ltm/lfy/mrq/etc, do the LTM math
      v
    Cite:               attach company, accession, filing date, and an anchor URL to every value
      v
    Print or write:     a table with citations, or a pack directory on disk

# Trails: narrative walks through concrete actions.
# Order matters. trail-0 is the entry point a new reader hits first.
trails:
  - id: trail-0-full-loop
    title: "From `edgarpack query NVDA revenue` to a cited number"
    estimated_minutes: 18
    covers:
      - edgarpack/cli.py:_cmd_query
      - edgarpack/query/financials.py:financials
      - edgarpack/sec/tickers.py:resolve_ticker
      - edgarpack/sec/xbrl.py:fetch_company_facts
      - edgarpack/query/concepts.py:resolve_concept
      - edgarpack/query/periods.py:select_period
      - edgarpack/query/models.py:CitedValue
    why: "First contact. Walks the most common command from keypress to printed table. Touches every load-bearing module in the query path."

  - id: trail-1-build-a-pack
    title: "How `edgarpack build` turns a filing into deterministic markdown"
    estimated_minutes: 14
    covers:
      - edgarpack/cli.py:_cmd_build
      - edgarpack/pack/build.py:build_pack
      - edgarpack/sec/submissions.py:get_latest_filing
      - edgarpack/sec/archives.py:fetch_filing_html
      - edgarpack/parse/ixbrl_strip.py:strip_ixbrl
      - edgarpack/parse/html_clean.py:clean_html
      - edgarpack/parse/semantic_html.py:reduce_to_semantic
      - edgarpack/parse/md_render.py:render_markdown
      - edgarpack/parse/sectionize.py:sectionize
      - edgarpack/pack/manifest.py:create_manifest
    why: "The other half of the system. Shows the parse pipeline as a strict ordered chain and explains why it has to be ordered. Also shows what 'deterministic' actually means in practice (sorted artifacts, hash-addressed manifest)."

  - id: trail-2-rate-limited-fetch
    title: "What happens during a single SEC HTTP call"
    estimated_minutes: 8
    covers:
      - edgarpack/sec/client.py:SECClient.fetch
      - edgarpack/sec/client.py:RateLimiter.acquire
      - edgarpack/sec/cache.py:DiskCache
      - edgarpack/config.py
    why: "The seam everything else depends on. Rate limiting, retry-with-backoff, atomic disk caching, gzip handling. If you don't understand this, you'll write code that gets the SEC angry at you."

  - id: trail-3-period-selection
    title: "How `--period ltm` becomes three filings and one formula"
    estimated_minutes: 16
    covers:
      - edgarpack/query/periods.py:select_period
      - edgarpack/query/financials.py:_compute_derived
      - edgarpack/query/concepts.py:METRIC_MAP
      - edgarpack/query/concepts.py:resolve_concept
    why: "The single subtlest part of the system. LTM math, anchor selection, fiscal-year matching, staleness rejection, segment filtering, the consolidated-vs-segment preference. Most reasoning bugs in financial code live here."

  - id: trail-4-citation-anchors
    title: "How a number gets a deep-link URL back to the filing"
    estimated_minutes: 10
    covers:
      - edgarpack/query/financials.py:_fetch_fact_id_maps
      - edgarpack/query/financials.py:_enrich_fact_ids
      - edgarpack/query/periods.py:parse_fact_ids_from_html
      - edgarpack/query/models.py:CitedValue.anchor_url
    why: "The part the README says 'really matters'. Walks the (concept, value) compound key, the inline XBRL fact_id parse, the URL fallback chain. Explains why the anchor URL is the difference between citation and hand-waving."

# Refs: function-level reference docs.
# A module gets a ref if other modules depend on it heavily, or if it has
# subtle invariants worth surfacing. Glue and thin wrappers don't need refs.
refs:
  - id: ref-sec-client
    module: edgarpack/sec/client.py
    why: "Network seam. Token bucket, retry-with-jittered-backoff, gzip handling, per-event-loop singleton. Every other module that touches the SEC depends on this."

  - id: ref-pack-build
    module: edgarpack/pack/build.py
    why: "13-step pack orchestrator. The order matters; this ref documents why each step exists, what it produces, and what would break if you reordered."

  - id: ref-sectionize
    module: edgarpack/parse/sectionize.py
    why: "Form-aware section detection. 824 lines of regex and form-specific rules. Slug stability, TOC stub filtering, the section_id contract that the manifest depends on."

  - id: ref-periods
    module: edgarpack/query/periods.py
    why: "The hairiest module in the codebase (961 lines). Period semantics, LTM math, anchor selection, segment filtering, ix:nonFraction parsing. Documents the invariants that aren't obvious from reading the code."

  - id: ref-financials
    module: edgarpack/query/financials.py
    why: "Top-level query orchestrator. Derived metric computation with cycle protection, staleness guards, the low-debt sanity check, fact_id enrichment pass."

  - id: ref-query-models
    module: edgarpack/query/models.py
    why: "The citation contract. CitedValue, DerivedValue, QueryResult. Every public number in the system flows through one of these. Documents the URL builders and the provenance fields."

  - id: ref-cache
    module: edgarpack/sec/cache.py
    why: "SHA256-keyed disk cache with atomic writes. Small file but encodes the determinism guarantee. Every fetch path goes through it."

