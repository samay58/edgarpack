name: Deploy showcase site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edgarpack
        run: pip install .

      - name: Build showcase packs
        run: |
          set -euo pipefail

          # Well-known companies so visitors see recognizable filings.
          # SEC EDGAR is public; no API key needed. GitHub-hosted runners share
          # outbound IP pools, so keep this showcase build deliberately patient.
          build_pack() {
            local cik="$1"
            local label="$2"
            local attempt=1
            local max_attempts=4
            local delay
            local log
            local next_attempt

            while true; do
              log="$(mktemp)"
              if edgarpack build "$cik" --form 10-K --out ./packs 2>&1 | tee "$log"; then
                rm -f "$log"
                break
              fi

              if ! grep -Eq "HTTP 429|HTTP 5[0-9][0-9]|timed out|Temporary failure|Connection reset" "$log"; then
                rm -f "$log"
                return 1
              fi

              rm -f "$log"

              if (( attempt >= max_attempts )); then
                echo "::error title=Showcase pack build failed::${label} (${cik}) failed after ${max_attempts} attempts."
                return 1
              fi

              delay=$(( attempt * 30 ))
              next_attempt=$(( attempt + 1 ))
              echo "::warning title=SEC build retry::${label} (${cik}) hit transient SEC/network throttling; waiting ${delay}s before attempt ${next_attempt}/${max_attempts}."
              sleep "$delay"
              attempt="$next_attempt"
            done

            sleep 20
          }

          build_pack 320193 Apple
          build_pack 789019 Microsoft
          build_pack 1018724 Amazon
          build_pack 1045810 NVIDIA
          build_pack 1652044 Alphabet
        env:
          EDGARPACK_USER_AGENT: "EdgarPack/CI admin@edgarpack.dev"
          EDGARPACK_SEC_RATE_LIMIT: "2"
          EDGARPACK_SEC_MAX_RETRIES: "6"

      - name: Generate site
        run: edgarpack site --packs ./packs --out ./site

      - name: Verify generated site
        run: test -s ./site/index.html && find ./site -type f -name '*.html' | grep -q .

      - name: Prepare for GitHub Pages
        run: touch ./site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
