name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run quality gate (lint, types, offline tests, web build)
        run: scripts/symphony_quality_gate.sh
        env:
          SYMPHONY_WEB: "1"
          EDGARPACK_CACHE_DIR: /tmp/edgarpack-cache
          EDGARPACK_USER_AGENT: "EdgarPack CI admin@edgarpack.dev"
