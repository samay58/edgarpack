# EdgarPack Filing Observatory - Company Universe
# This file defines which companies and filings to harvest.
#
# Usage: edgarpack harvest --universe universe.toml --out ./packs
#
# Per-company overrides take precedence over [defaults].
# Foreign filers (20-F) need explicit CIK and forms_20f.

[defaults]
forms_10k = 2
forms_10q = 4
forms_8k = 5

