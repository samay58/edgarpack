version: 1
notes:
  - "This corpus is proposed by Phase 0 discovery. It pins current behavior before vNext design."
  - "Current implementation is the oracle, but known-bad behavior may be intentionally changed later."
  - "Real identifiers are drawn from the discovery corpus real_examples and tests. Where a specific filing is needed but not pinned in-repo, accession is a placeholder and needs_selection is true."
  - "User-facing __version__ is 0.1.0 (edgarpack/__init__.py:5); determinism keys off PARSER_VERSION 0.2.1 / SCHEMA_VERSION 1 (edgarpack/config.py:50-51). These are intentionally decoupled."
  - "snapshot_policy levels: exact = byte-deterministic artifacts; normalized = strip timestamps/versions/paths; semantic = value+provenance equivalence; manual = LLM/VLM/translation non-determinism; known_bad = a pinned current defect; deprecated = parked surface."
  - "command_vnext mirrors command_current unless a vNext rename is implied; the rewrite owns whether to keep argparse subcommand names."

cases:

  # =====================================================================
  # REQUIRED PARITY  (active workflows the rewrite must reproduce)
  # =====================================================================

  - id: sec-build-latest-10k
    status: required
    source_family: sec
    workflow: build
    description: "Build a pack from the latest 10-K for an established SEC filer, default artifact set."
    user_job: "Get a clean, section-addressable markdown pack of a company's most recent annual report."
    company: "NVIDIA CORP"
    ticker: NVDA
    cik: "0001045810"
    accession: ""
    form: "10-K"
    period: ""
    inputs:
      command_current:
        - "uv run edgarpack build NVDA --form 10-K"
      command_vnext:
        - "uv run edgarpack build NVDA --form 10-K"
      fixtures: []
      env_required:
        - EDGARPACK_USER_AGENT
    outputs:
      artifacts:
        - "packs/<cik>/<accession>/filing.full.md"
        - "packs/<cik>/<accession>/sections/*.md"
        - "packs/<cik>/<accession>/manifest.json"
        - "packs/<cik>/<accession>/llms.txt"
      stdout: true
      stderr: false
      cache_expected: true
    snapshot_policy:
      level: exact
      normalize:
        - "manifest.json:generated_at"
        - "manifest.json:built_at"
        - "manifest.json:parser_version"
        - "manifest.json:schema_version"
        - "absolute output paths"
    invariants:
      - "Rebuild produces byte-identical filing.full.md / sections/*.md / llms.txt for a fixed PARSER_VERSION."
      - "manifest.source.fetched_at is forced to filing_date midnight UTC, not real fetch time (manifest.py:151-157)."
      - "Every section and artifact carries a SHA256; manifest.json excludes its own hash (build.py:312-318)."
      - "filing.full.md is prepended with '# <company> | <form> | Filed <date>' before sectionize."
    why_this_case_exists: "Primary write path; the determinism guarantee is the core of the product and only has a live+slow test today."
    edge_cases_covered:
      - "default form resolution"
      - "title prepend participating in char offsets"
    required_for_vnext_parity: true
    known_current_issues:
      - "Determinism only verified live+slow against this exact filer (test_determinism.py); no offline byte-identity test exists."
      - "Tokenizer fallback (len//4 when tiktoken cache cold) can change manifest tokens_total and chunk bytes across environments (BACKLOG item 4)."
    needs_selection: true
    confidence: high

